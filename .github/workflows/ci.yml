# Basis geautomatiseerde controle (spec-item "basis geautomatiseerde tests
# opzetten"): draait bij elke push/PR automatisch — geen handmatige stap
# nodig. Vervangt NIET het handmatig testen op vyra.now na een deploy, maar
# vangt wél de meest voorkomende fouten (typefouten, kapotte tests, een
# build die niet meer lukt) al vóórdat je ze zelf tegenkomt. Draait met
# NUL environment variables (net als deze `next build` altijd al kon —
# gecontroleerd: de app valt overal netjes terug op demo-/mock-gedrag
# zonder Supabase/Stripe/AI-sleutels), dus er hoeven geen geheimen in de
# GitHub-repo-instellingen te worden gezet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
